{% extends "base.html" %}

{% block title %}Explore - SheSafe{% endblock %}

{% block styles %}
<style>
    #map {
        height: 100%;
        width: 100%;
        position: absolute;
        top: 0;
        left: 0;
        z-index: 0;
    }

    .user-location-pulse {
        animation: pulse-blue 2s infinite;
    }

    @keyframes pulse-blue {
        0% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7);
        }

        70% {
            transform: scale(1);
            box-shadow: 0 0 0 10px rgba(37, 99, 235, 0);
        }

        100% {
            transform: scale(0.95);
            box-shadow: 0 0 0 0 rgba(37, 99, 235, 0);
        }
    }
</style>
{% endblock %}

{% block content %}
<style>@media (max-width:350px){.kgp-ic{display:none}}</style>
<div class="relative flex h-[calc(100vh-72px)] w-full flex-col overflow-hidden bg-slate-100">
    <!-- Map background -->
    <div id="map" class="absolute inset-0 z-0"></div>

    <!-- Top Overlays -->
    <div id="top-overlays" class="relative z-10 flex flex-col pt-12 px-4 gap-3 pointer-events-none">
        {#
        <div class="flex items-center justify-between pointer-events-auto">
            <h1 class="text-navy-trust text-xl font-bold tracking-tight drop-shadow-sm mx-auto">SheSafe</h1>
        </div>
        #}

        <!-- Filters scroll -->
        <div class="flex gap-2 py-1 overflow-x-auto no-scrollbar pointer-events-auto">
            <div id="filter-Washroom" onclick="toggleFilter('Washroom')"
                class="filter-chip flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white/90 backdrop-blur-md px-4 shadow-sm border border-slate-100 cursor-pointer active:scale-95 transition-all">
                <span class="material-symbols-outlined text-navy-trust/70 text-[18px]">woman</span>
                <p class="text-navy-trust/70 text-xs font-bold whitespace-nowrap">Washroom</p>
            </div>
            <div id="filter-Period-Care" onclick="toggleFilter('Period Care')"
                class="filter-chip flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white/90 backdrop-blur-md px-4 shadow-sm border border-slate-100 cursor-pointer active:scale-95 transition-all">
                <span class="material-symbols-outlined text-navy-trust/70 text-[18px]">sanitizer</span>
                <p class="text-navy-trust/70 text-xs font-bold whitespace-nowrap">Period Care</p>
            </div>
            <div id="filter-Changing-Room" onclick="toggleFilter('Changing Room')"
                class="filter-chip flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white/90 backdrop-blur-md px-4 shadow-sm border border-slate-100 cursor-pointer active:scale-95 transition-all">
                <span class="material-symbols-outlined text-navy-trust/70 text-[18px]">checkroom</span>
                <p class="text-navy-trust/70 text-xs font-bold whitespace-nowrap">Changing</p>
            </div>
            <div id="filter-Nursing-Room" onclick="toggleFilter('Nursing Room')"
                class="filter-chip flex h-9 shrink-0 items-center justify-center gap-x-2 rounded-full bg-white/90 backdrop-blur-md px-4 shadow-sm border border-slate-100 cursor-pointer active:scale-95 transition-all">
                <span class="material-symbols-outlined text-navy-trust/70 text-[18px]">child_care</span>
                <p class="text-navy-trust/70 text-xs font-bold whitespace-nowrap">Nursing</p>
            </div>
        </div>

            </div>

    <!-- Floating Action Buttons -->
    <div id="fab" class="absolute z-10 flex flex-col gap-3 items-end" style="top:150px;right:12px;left:auto">
        <button onclick="recenterMap()"
            class="flex h-12 px-5 items-center gap-2 rounded-full bg-white text-navy-trust shadow-lg border border-slate-100 font-bold text-sm active:scale-95 transition-all">
            <span class="material-symbols-outlined text-[20px]">my_location</span>
            Recenter
        </button>
        <button onclick="window.location.href='tel:112'"
            aria-label="Call 112, India's national emergency number - opens your phone dialer" title="Call 112, India's national emergency number (opens your phone dialer)"
            class="flex h-12 px-4 self-end items-center justify-center gap-1.5 rounded-full bg-sos-red text-white shadow-xl relative active:scale-90 transition-all">
            <span class="material-symbols-outlined text-2xl fill-1">error</span>
            <span class="text-xs font-black uppercase tracking-wider">Call 112</span>
            <span class="absolute -top-1 -right-1 flex h-4 w-4">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-4 w-4 bg-sos-red"></span>
            </span>
        </button>
    </div>

    <!-- Bottom Sheet Vendor Info -->
    <div id="vendor-list-container"
        class="mt-auto relative z-20 px-4 pb-6 overflow-x-auto no-scrollbar flex gap-4 snap-x" style="background:#fff;padding-top:14px;border-radius:24px 24px 0 0;box-shadow:0 -4px 16px #0000001a">
        <!-- Vendor cards will be dynamically injected here -->
    </div>
</div>

<!-- Vendor JSON Data (Robust storage) -->
<script id="vendors-json" type="application/json">
    [
        {% for vendor in vendors %}
        {
            "id": {{ vendor.id }},
            "name": {{ vendor.business_name|tojson }},
            "lat": {{ (vendor.latitude or 28.6139)|tojson }},
            "lng": {{ (vendor.longitude or 77.2090)|tojson }},
            "address": {{ vendor.address|tojson }},
            "rating": {{ (vendor.average_rating or 0.0)|tojson }},
            "reviews": {{ (vendor.feedbacks|length if vendor.feedbacks else 0)|tojson }},
            "categories": {{ (vendor.category or "").split(", ")|tojson }},
            "image_url": {{ (vendor.to_dict().image_url)|tojson }},
            "verified": true
        }{% if not loop.last or listings %},{% endif %}
        {% endfor %}
        {% for v in listings %}
        {
            "id": {{ v.slug|tojson }},
            "kind": "listing",
            "name": {{ v.name|tojson }},
            "lat": {{ v.lat|tojson }},
            "lng": {{ v.lng|tojson }},
            "address": {{ v.address|tojson }},
            "rating": {{ v.sample_rating|tojson }},
            "reviews": {{ v.sample_reviews|length|tojson }},
            "categories": ["Washroom"],
            "maps_url": {{ v.maps_url|tojson }},
            "details_url": "/demo/venue/{{ v.slug }}",
            "verified": false
        }{% if not loop.last %},{% endif %}
        {% endfor %}
    ]
</script>
{% endblock %}

{% block scripts %}
<script>
    let map;
    let markerPairs = [];
    let userMarker;
    let userPos = null;
    let usingDemoArea = false;
    const FORCED_AREA = {{ 'true' if forced_area else 'false' }};
    let refPos = null;
    const NONE_MSG = 'No verified women\'s washroom is listed yet.';

    // Parse vendors from robust JSON block
    const vendors = JSON.parse(document.getElementById('vendors-json').textContent);

    // Haversine distance in meters (replaces google.maps.geometry)
    function distanceMeters(lat1, lng1, lat2, lng2) {
        const R = 6371000;
        const toRad = (d) => d * Math.PI / 180;
        const dLat = toRad(lat2 - lat1);
        const dLng = toRad(lng2 - lng1);
        const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(a));
    }

    function layoutMap() {
        const mapEl = document.getElementById('map');
        const sheet = document.getElementById('vendor-list-container');
        if (!mapEl || !sheet) return;
        mapEl.style.height = 'auto';
        mapEl.style.bottom = sheet.offsetHeight + 'px';
        const to = document.getElementById('top-overlays'), fab = document.getElementById('fab');
        if (to && fab) fab.style.top = (to.offsetTop + to.offsetHeight + 8) + 'px';
        if (typeof google !== 'undefined' && map) google.maps.event.trigger(map, 'resize');
    }
    window.addEventListener('resize', layoutMap);
    window.addEventListener('load', () => setTimeout(layoutMap, 300));

    function initMap() {
        const defaultCenter = { lat: 28.6139, lng: 77.2090 };
        map = new google.maps.Map(document.getElementById('map'), {
            center: defaultCenter, zoom: 14, disableDefaultUI: true, zoomControl: false,
            gestureHandling: 'greedy', clickableIcons: false
        });
        map.easeTo = function (o) { const c = o.center; map.panTo(Array.isArray(c) ? { lat: c[1], lng: c[0] } : (c.lat !== undefined && typeof c.lat === 'number' ? c : { lat: c.lat(), lng: c.lng() })); if (o.zoom) map.setZoom(o.zoom); };
        // Geolocation: closest verified washroom first. Ashoka demo area only when explicitly chosen.
        const AREA = { lat: 28.948445948109907, lng: 77.09660988721876 };
        if (FORCED_AREA) {
            showDemoAreaNotice(AREA);
        } else if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => handlePosition({ lat: position.coords.latitude, lng: position.coords.longitude }),
                (error) => {
                    console.error("Geolocation error:", error);
                    noVerifiedNearby('Turn on location to see the closest women\'s washroom to you.', true);
                }
            );
        } else {
            noVerifiedNearby('Turn on location to see the closest women\'s washroom to you.', true);
        }

        window.handlePosition = handlePosition;
        function handlePosition(pos) {
            userPos = pos;
            map.setOptions({ center: pos, zoom: 15 });
            if (userMarker) userMarker.setMap(null);
            userMarker = new google.maps.Marker({ position: pos, map: map, icon: { path: google.maps.SymbolPath.CIRCLE, scale: 8, fillColor: '#4285F4', fillOpacity: 1, strokeColor: '#fff', strokeWeight: 3 } });
            if (!vendors.length) { noVerifiedNearby(NONE_MSG); settleMap(pos); return; }
            refPos = pos;
            updateNearestVendor(pos);
            settleMap(pos);
        }

        // Re-measure and recentre once the sheet has its final height so no tiles stay unpainted.
        function settleMap(pos) {
            [300, 1200].forEach((ms) => setTimeout(() => {
                layoutMap();
                google.maps.event.trigger(map, 'resize');
                map.setCenter(pos);
            }, ms));
        }

        function noVerifiedNearby(msg, retry) {
            clearMarkers();
            const c = document.getElementById('vendor-list-container');
            c.innerHTML = `
                <div style="width:calc(100vw - 32px);max-width:100%;box-sizing:border-box;flex:none;white-space:normal" class="flex flex-col gap-3 p-2">
                    <p class="text-navy-trust font-bold text-base">${msg}</p>
                    ${retry ? '<button type="button" onclick="recenterMap()" class="flex items-center justify-center text-center px-3 py-2 min-h-12 rounded-2xl bg-navy-trust text-white font-bold text-sm">Use my location</button>' : ''}
                </div>`;
            layoutMap();
            if (retry && vendors.length) {
                // No location yet: frame all listings so the map is populated, not blank.
                const b = new google.maps.LatLngBounds();
                vendors.forEach(v => b.extend({ lat: v.lat, lng: v.lng }));
                [100, 900].forEach((ms) => setTimeout(() => { layoutMap(); google.maps.event.trigger(map, 'resize'); map.fitBounds(b, 40); }, ms));
                renderMarkers(vendors);
            }
        }

        function showDemoAreaNotice(demoPos) {
            const notice = document.createElement('div');
            notice.style.cssText = 'align-self:center;pointer-events:auto;background:#fff;color:#334155;font-size:11px;font-weight:700;padding:6px 12px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.15);';
            usingDemoArea = true;
            refPos = demoPos;
            notice.innerText = 'Bookable places are near Ashoka University';
            document.getElementById('top-overlays').appendChild(notice);
            layoutMap();
            map.easeTo({ center: demoPos });
            updateNearestVendor(demoPos);
        }

        // Add vendor markers
        renderMarkers(vendors);
    }

    let selectedFilters = new Set();

    function toggleFilter(filter) {
        if (selectedFilters.has(filter)) {
            selectedFilters.delete(filter);
        } else {
            selectedFilters.add(filter);
        }
        updateFilterUI();
        applyFilters();
    }

    function updateFilterUI() {
        document.querySelectorAll('.filter-chip').forEach(chip => {
            const filterName = chip.id.replace('filter-', '').replace(/-/g, ' ');
            if (selectedFilters.has(filterName)) {
                chip.classList.remove('bg-white/90', 'border-slate-100');
                chip.classList.add('bg-primary-pink', 'border-pink-200');
                chip.querySelector('span').classList.remove('text-navy-trust/70');
                chip.querySelector('span').classList.add('text-navy-trust', 'fill-1');
                chip.querySelector('p').classList.remove('text-navy-trust/70');
                chip.querySelector('p').classList.add('text-navy-trust');
            } else {
                chip.classList.add('bg-white/90', 'border-slate-100');
                chip.classList.remove('bg-primary-pink', 'border-pink-200');
                chip.querySelector('span').classList.add('text-navy-trust/70');
                chip.querySelector('span').classList.remove('text-navy-trust', 'fill-1');
                chip.querySelector('p').classList.add('text-navy-trust/70');
                chip.querySelector('p').classList.remove('text-navy-trust');
            }
        });
    }

    function applyFilters() {
        if (!FORCED_AREA && !refPos) return;
        let filteredVendors;
        if (selectedFilters.size === 0) {
            filteredVendors = vendors;
        } else {
            filteredVendors = vendors.filter(v =>
                Array.from(selectedFilters).every(f => v.categories.includes(f))
            );
        }

        clearMarkers();
        renderMarkers(filteredVendors);

        if (refPos) {
            updateNearestVendor(refPos, filteredVendors);
        } else {
            renderVendorList(filteredVendors);
        }
    }

    function pinIcon(color, scale) {
        return { path: 'M12,2C8.13,2,5,5.13,5,9c0,5.25,7,13,7,13s7-7.75,7-13C19,5.13,15.87,2,12,2z', fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2, scale: scale, anchor: new google.maps.Point(12, 22) };
    }

    function vendorKey(v) { return String(v.id); }
    let selectedKey = null;
    let lastRendered = [];

    function selectVendor(vendor, opts) {
        opts = opts || {};
        selectedKey = vendorKey(vendor);
        markerPairs.forEach(p => {
            const sel = vendorKey(p.vendor) === selectedKey;
            p.marker.setIcon(pinIcon(sel ? '#cc285f' : '#001F3F', sel ? 2.1 : 1.6));
            p.marker.setZIndex(sel ? 1000 : 1);
        });
        if (opts.center !== false && typeof map !== 'undefined' && map) map.easeTo({ center: { lat: vendor.lat, lng: vendor.lng } });
        if (opts.scroll) {
            const card = document.querySelector('[data-vendor-key="' + selectedKey + '"]');
            const container = document.getElementById('vendor-list-container');
            if (card && container) container.scrollTo({ left: card.offsetLeft - (container.clientWidth - card.clientWidth) / 2, behavior: 'smooth' });
        }
    }

    function clearMarkers() {
        markerPairs.forEach(p => p.marker.setMap(null));
        markerPairs = [];
    }

    function renderMarkers(vendorsToRender) {
        vendorsToRender.forEach(vendor => {
            const marker = new google.maps.Marker({ position: { lat: vendor.lat, lng: vendor.lng }, map: map, title: vendor.name, icon: pinIcon('#001F3F', 1.6) });
            marker.addListener('click', () => { selectVendor(vendor, { scroll: true, center: true }); });
            markerPairs.push({ vendor: vendor, marker: marker });
        });
    }

    function recenterMap() {
        if (userMarker) {
            map.setOptions({ center: userMarker.getPosition().toJSON(), zoom: 15 });
        } else if (!FORCED_AREA) {
            if (navigator.geolocation) navigator.geolocation.getCurrentPosition((p) => window.handlePosition({ lat: p.coords.latitude, lng: p.coords.longitude }), () => {});
        } else {
            // No browser location: recenter on the labelled demo area
            map.easeTo({ center: { lat: 28.948445948109907, lng: 77.09660988721876 }, zoom: 14 });
        }
    }

    function updateNearestVendor(userPosArg, vendorsList = vendors) {
        if (!vendorsList || vendorsList.length === 0) {
            document.getElementById('vendor-list-container').innerHTML = `
                <div class="bg-white rounded-3xl shadow-2xl p-6 flex flex-col items-center justify-center gap-2 border border-slate-100 min-w-full">
                    <span class="material-symbols-outlined text-4xl text-slate-300">search_off</span>
                    <p class="text-navy-trust font-bold">No matching vendors</p>
                    <p class="text-slate-500 text-xs">Try changing filters</p>
                </div>
            `;
            return;
        }

        const vendorsWithDist = vendorsList.map(v => {
            const dist = distanceMeters(userPosArg.lat, userPosArg.lng, v.lat, v.lng);
            return { ...v, dist };
        });

        vendorsWithDist.sort((a, b) => a.dist - b.dist);

        renderVendorList(vendorsWithDist);
    }

    function renderVendorList(sortedVendors) {
        const container = document.getElementById('vendor-list-container');
        container.innerHTML = '';
        if (sortedVendors.length === 0) {
            container.innerHTML = '<div class="text-slate-500 text-sm font-bold p-4 bg-white rounded-2xl shadow">No venues in this category yet.</div>';
            return;
        }

        sortedVendors.forEach((vendor, index) => {
            const distText = vendor.dist < 1000 ? Math.round(vendor.dist) + 'm' : (vendor.dist / 1000).toFixed(1) + 'km';
            const walkTime = Math.round(vendor.dist / 80);
            const showEta = vendor.dist <= 5000;
            const isNearest = index === 0;

            const card = document.createElement('div');
            card.className = "min-w-[90%] max-w-[90%] sm:min-w-[320px] snap-center bg-white rounded-3xl shadow-xl p-4 flex flex-col gap-4 border border-slate-100 transition-transform active:scale-[0.98]";
            card.style.cssText = "min-width:88%;max-width:88%;flex:none";
            card.dataset.vendorKey = vendorKey(vendor);
            card.innerHTML = `
                <div class="flex items-center gap-2">
                    ${vendor.verified ? '<span class="px-2 py-0.5 bg-green-50 text-green-700 text-[9px] font-bold rounded uppercase tracking-wider">Verified</span>' : ''}
                    ${isNearest ? `<span class="px-2 py-0.5 bg-blue-50 text-blue-600 text-[9px] font-bold rounded uppercase tracking-wider">${usingDemoArea ? 'Nearest here' : 'Nearest to you'}</span>` : ''}
                </div>
                <div class="flex gap-3">
                    <div style="width:80px;height:80px;flex:none" class="relative shrink-0 rounded-2xl overflow-hidden shadow-inner bg-slate-100">
                        <div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#fdeaf1"><span class="material-symbols-outlined" style="font-size:36px;color:#cc285f">woman</span></div>
                    </div>
                    <div class="flex flex-col flex-1 min-w-0 justify-between gap-2">
                        <div>
                            <div class="flex justify-between items-start">
                                <h3 class="text-navy-trust font-bold text-base leading-tight break-words">${vendor.name}</h3>
                                <button class="text-slate-300 hover:text-primary-pink transition-colors">
                                    <span class="material-symbols-outlined text-[20px]">bookmark</span>
                                </button>
                            </div>
                            <p class="text-slate-500 text-xs mt-0.5" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${vendor.address}</p>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <div class="flex items-center gap-1.5 bg-green-50 px-2 py-1 rounded-lg text-green-700">
                                <span class="material-symbols-outlined text-[16px]">directions_walk</span>
                                <span class="font-bold text-[11px]">${distText}${showEta ? ' &bull; ' + walkTime + ' mins' : ' away'}</span>
                            </div>
                            <div class="flex items-center gap-1 border-l border-slate-100 pl-3">
                                <span class="material-symbols-outlined text-primary-pink text-[18px] fill-1">star</span>
                                <span class="text-navy-trust font-bold text-sm">${vendor.reviews > 0 ? vendor.rating : 'New'}</span>
                            </div>
                        </div>
                    </div>
                </div>
                ${vendor.kind === 'listing' ? `<div class="flex gap-1.5">
                    <a href="${vendor.details_url}#book" class="flex-1 flex items-center justify-center h-12 rounded-2xl bg-navy-trust text-white font-bold text-sm no-underline" style="font-size:12px;min-width:0;gap:4px">
                        <span class="material-symbols-outlined text-lg kgp-ic">calendar_month</span>Book
                    </a>
                    <a href="${vendor.maps_url}" target="_blank" rel="noopener" class="flex-1 flex items-center justify-center h-12 rounded-2xl border-2 border-primary-pink/20 bg-primary-pink/5 text-navy-trust font-bold text-sm no-underline" style="font-size:12px;min-width:0;gap:4px">
                        <span class="material-symbols-outlined text-lg kgp-ic">directions</span>Directions
                    </a>
                    <a href="${vendor.details_url}" class="flex-1 flex items-center justify-center h-12 rounded-2xl border-2 border-slate-200 bg-white text-navy-trust font-bold text-sm no-underline" style="font-size:12px;min-width:0;gap:4px">
                        <span class="material-symbols-outlined text-lg kgp-ic">star</span>Reviews
                    </a>
                </div>` : `<div class="flex gap-1.5">
                    <a href="/vendor/${vendor.id}" class="flex-1 flex items-center justify-center gap-2 h-12 rounded-2xl bg-navy-trust text-white font-bold text-sm shadow-lg shadow-navy-trust/20 active:scale-[0.98] transition-all" style="font-size:12px;min-width:0;padding:0 4px;gap:4px">
                        <span class="material-symbols-outlined text-lg">calendar_month</span>
                        Book
                    </a>
                    <a href="/vendor/${vendor.id}#reviews" class="flex-1 flex items-center justify-center gap-1 h-12 rounded-2xl border-2 border-slate-200 bg-white text-navy-trust font-bold text-sm active:scale-[0.98] transition-all no-underline" style="font-size:12px;min-width:0;padding:0 4px;gap:4px">
                        <span class="material-symbols-outlined text-lg kgp-ic">star</span>
                        Reviews
                    </a>
                    <a href="https://www.google.com/maps/dir/?api=1&destination=${vendor.lat},${vendor.lng}" target="_blank" rel="noopener" class="flex-1 flex items-center justify-center gap-2 h-12 rounded-2xl border-2 border-primary-pink/20 bg-primary-pink/5 text-navy-trust font-bold text-sm active:scale-[0.98] transition-all no-underline" style="font-size:12px;min-width:0;padding:0 4px;gap:4px">
                        <span class="material-symbols-outlined text-lg kgp-ic">directions</span>
                        Directions
                    </a>
                </div>`}
            `;

            card.onclick = (e) => {
                if (e.target.closest('a') || e.target.closest('button')) return;
                selectVendor(vendor, { center: true });
            };

            container.appendChild(card);
        });
        lastRendered = sortedVendors;
        if (sortedVendors.length) selectVendor(sortedVendors[0], { center: false });
        layoutMap();
    }

    // Sliding between cards selects that vendor: highlight its pin and center the map on it.
    (function () {
        const container = document.getElementById('vendor-list-container');
        let scrollT = null;
        container.addEventListener('scroll', () => {
            if (scrollT) clearTimeout(scrollT);
            scrollT = setTimeout(() => {
                const cards = Array.from(container.querySelectorAll('[data-vendor-key]'));
                if (!cards.length) return;
                const mid = container.getBoundingClientRect().left + container.clientWidth / 2;
                let best = null, bd = Infinity;
                cards.forEach(c => {
                    const r = c.getBoundingClientRect();
                    const d = Math.abs(r.left + r.width / 2 - mid);
                    if (d < bd) { bd = d; best = c; }
                });
                if (!best) return;
                const v = lastRendered.find(x => vendorKey(x) === best.dataset.vendorKey);
                if (v && vendorKey(v) !== selectedKey) selectVendor(v, { center: true });
            }, 140);
        });
    })();

    window.initMap = initMap;
