{% extends "base.html" %}

{% block title %}Edit Profile - SheSafe{% endblock %}

{% block content %}
<div
    class="relative flex min-h-screen w-full flex-col overflow-x-hidden pb-32 max-w-[430px] mx-auto bg-[#F8FAFC] dark:bg-background-dark">
    <div
        class="flex items-center px-5 pt-10 pb-4 justify-between sticky top-0 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md z-40 border-b border-slate-100 dark:border-slate-800">
        <h1 class="text-navy-trust dark:text-white text-2xl font-black tracking-tight">Edit Space</h1>
        <a href="{{ url_for('main.vendor_dashboard') }}"
            class="text-brand-pink text-xs font-bold uppercase tracking-wider">Cancel</a>
    </div>

    <form method="POST" class="px-5 mt-6 space-y-5">
        <div>
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Business Name</label>
            <input type="text" name="business_name" value="{{ vendor.business_name }}" required
                class="mt-1 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-3 text-sm text-navy-trust dark:text-white">
        </div>
        <div>
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Description</label>
            <textarea name="description" rows="3"
                class="mt-1 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-3 text-sm text-navy-trust dark:text-white">{{ vendor.description or '' }}</textarea>
        </div>
        <div>
            <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Address</label>
            <input type="text" name="address" value="{{ vendor.address }}" required
                class="mt-1 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-3 text-sm text-navy-trust dark:text-white">
        </div>

        <label
            class="flex items-center justify-between bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 px-4 py-3">
            <span class="text-sm font-bold text-navy-trust dark:text-white">CCTV Secure</span>
            <input type="checkbox" name="has_cctv" {% if vendor.has_cctv %}checked{% endif %}
                class="size-5 accent-pink-500">
        </label>
        <label
            class="flex items-center justify-between bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 px-4 py-3">
            <span class="text-sm font-bold text-navy-trust dark:text-white">Female Staff Available</span>
            <input type="checkbox" name="has_female_staff" {% if vendor.has_female_staff %}checked{% endif %}
                class="size-5 accent-pink-500">
        </label>
        <div class="flex gap-3">
            <div class="flex-1">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Staff From</label>
                <input type="time" name="female_staff_start_time"
                    value="{{ vendor.female_staff_start_time.strftime('%H:%M') if vendor.female_staff_start_time else '' }}"
                    class="mt-1 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-3 text-sm text-navy-trust dark:text-white">
            </div>
            <div class="flex-1">
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Staff Until</label>
                <input type="time" name="female_staff_end_time"
                    value="{{ vendor.female_staff_end_time.strftime('%H:%M') if vendor.female_staff_end_time else '' }}"
                    class="mt-1 w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 px-4 py-3 text-sm text-navy-trust dark:text-white">
            </div>
        </div>
        <label
            class="flex items-center justify-between bg-white dark:bg-slate-900 rounded-2xl border border-slate-100 dark:border-slate-800 px-4 py-3">
            <span class="text-sm font-bold text-navy-trust dark:text-white">Open for Bookings</span>
            <input type="checkbox" name="is_active" {% if vendor.is_active %}checked{% endif %}
                class="size-5 accent-pink-500">
        </label>

        <button type="submit"
            class="w-full bg-primary text-white py-4 rounded-2xl font-bold text-xs uppercase tracking-widest active:scale-95 transition-all shadow-lg shadow-primary/20">
            Save Changes
        </button>
    </form>
</div>
{% endblock %}
